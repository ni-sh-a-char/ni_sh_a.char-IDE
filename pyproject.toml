[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nishachar-ide"
version = "2.0.0"
description = "Run any language, anywhere. A polyglot execution engine, a local IDE, and an embeddable component."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Piyush Mishra", email = "piyushmishra.professional@gmail.com" }]
keywords = [
    "ide", "code-editor", "polyglot", "sandbox", "code-execution",
    "repl", "web-component", "she-lang", "playground", "runner",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# A real TTY on Windows. POSIX uses the standard library's pty module.
pty = ["pywinpty>=2.0; sys_platform == 'win32'"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "jsonschema>=4",
    "build>=1",
]

[project.scripts]
nishachar = "nishachar.cli:main"

[project.urls]
Homepage = "https://ni-sh-a-char.github.io/ni_sh_a.char-IDE/"
Documentation = "https://ni-sh-a-char.github.io/ni_sh_a.char-IDE/docs/"
Source = "https://github.com/ni-sh-a-char/ni_sh_a.char-IDE"
Issues = "https://github.com/ni-sh-a-char/ni_sh_a.char-IDE/issues"
Changelog = "https://github.com/ni-sh-a-char/ni_sh_a.char-IDE/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["packages/core/nishachar"]

# The registry lives at the repo root so contributors can find it, but it has
# to travel inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"languages" = "nishachar/languages"

[tool.hatch.build.targets.sdist]
include = ["packages/core", "languages", "examples", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["packages/core"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
