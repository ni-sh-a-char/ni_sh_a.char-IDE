<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ni_sh_a.char-IDE</title>
<meta name="description" content="Run any language, anywhere.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230d0d14'/><path d='M8 11l5 5-5 5M17 21h7' stroke='%23b48cff' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="./app.css">
<style>
  :root {
    --bg: #0a0a10; --surface: #14141f; --border: #24243a;
    --fg: #e6e6f0; --muted: #8a8aa8; --accent: #b48cff; --accent-2: #6ee7b7;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--sans); display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex: 0 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -.01em; }
  .brand svg { width: 22px; height: 22px; }
  .brand small { font: 500 11px var(--mono); color: var(--muted); }
  .spacer { flex: 1; }

  .chip {
    font: 600 11px var(--mono); color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 10px;
  }
  .chip b { color: var(--accent-2); font-weight: 700; }

  button.ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font: 600 12px var(--sans); cursor: pointer;
  }
  button.ghost:hover { color: var(--fg); border-color: var(--accent); }
  button.ghost[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  nishachar-ide { flex: 1 1 auto; min-height: 0; height: auto; }
  nishachar-ide::part(toolbar) { border-radius: 0; }

  #term-wrap {
    flex: 0 0 clamp(160px, 28vh, 300px);
    border-top: 1px solid var(--border); background: #07070d;
    display: flex; flex-direction: column;
  }
  #term-wrap[hidden] { display: none; }
  #term-head {
    display: flex; align-items: center; gap: 10px; padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
  }
  #term { flex: 1 1 auto; min-height: 0; padding: 6px 8px; }
  #term-note { padding: 14px; color: var(--muted); font: 13px var(--sans); }
  #term-note code {
    font-family: var(--mono); color: var(--accent-2);
    background: var(--surface); padding: 2px 6px; border-radius: 5px;
  }
  a { color: var(--accent); }
  @media (max-width: 640px) { .chip.wide { display: none; } }
</style>
</head>
<body>
<header>
  <span class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#14141f"/>
      <path d="M8 11l5 5-5 5M17 21h7" stroke="#b48cff" stroke-width="2.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    ni_sh_a.char-IDE <small id="version"></small>
  </span>
  <span class="chip wide"><b id="lang-count">—</b> languages</span>
  <span class="spacer"></span>
  <span class="chip" id="runner-chip">—</span>
  <button class="ghost" id="toggle-term" aria-pressed="false">Terminal</button>
  <a class="ghost" style="text-decoration:none"
     href="https://github.com/ni-sh-a-char/ni_sh_a.char-IDE" target="_blank" rel="noopener">GitHub</a>
</header>

<main>
  <nishachar-ide id="ide" language="she" stdin></nishachar-ide>
  <section id="term-wrap" hidden>
    <div id="term-head">
      <span>Terminal</span>
      <span class="spacer" style="flex:1"></span>
      <span id="term-status"></span>
    </div>
    <div id="term"></div>
    <div id="term-note" hidden></div>
  </section>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
