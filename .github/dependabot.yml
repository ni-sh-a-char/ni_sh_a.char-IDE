version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }
    labels: ["dependencies"]

  - package-ecosystem: npm
    directory: /packages/web
    target-branch: develop
    schedule: { interval: monthly }
    commit-message: { prefix: "deps" }
    labels: ["dependencies"]
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*", "codemirror"]
      # xterm and its addons pin each other with peer ranges, so bumping one
      # alone can never install. They have to move together.
      xterm:
        patterns: ["@xterm/*"]

  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    commit-message: { prefix: "deps" }
    labels: ["dependencies"]
