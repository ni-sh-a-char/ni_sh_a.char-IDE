name: Release

# Publishing is manual by default: a tag builds and verifies everything, then
# each registry step runs only if its credentials are configured. That keeps a
# fork from failing loudly on secrets it was never given.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Trusted Publishing -- no API token to store or leak.
    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing uses OIDC, so there is no secret to probe. Set the
      # repository variable PUBLISH_PYPI=true once the pending publisher exists
      # on pypi.org -- see RELEASING.md.
      - name: Skip until Trusted Publishing is configured
        id: gate
        run: |
          if [ "${{ vars.PUBLISH_PYPI }}" != "true" ]; then
            echo "::notice::PUBLISH_PYPI is not 'true' -- skipping PyPI."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Build the IDE shell into the package
        if: steps.gate.outputs.ready == 'true'
        working-directory: packages/web
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.ready == 'true'
        run: pip install build twine
      - if: steps.gate.outputs.ready == 'true'
        run: python -m build
      - if: steps.gate.outputs.ready == 'true'
        run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.gate.outputs.ready == 'true'
        with:
          skip-existing: true

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # `npm publish --provenance` signs an attestation over OIDC; without this
      # npm exits EUSAGE before uploading anything.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
        working-directory: packages/web
      - run: npm run build
        working-directory: packages/web
      - name: Publish
        working-directory: packages/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set -- skipping publish."
            exit 0
          fi
          npm publish --access public --provenance

  pub:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # pub.dev automated publishing uses OIDC -- no token stored.
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - uses: actions/checkout@v4

      # pub.dev only allows automated publishing for a package that already
      # exists, so the first publish is manual. Set PUBLISH_PUB=true after
      # enabling automated publishing -- see RELEASING.md.
      - name: Skip until automated publishing is enabled
        id: gate
        run: |
          if [ "${{ vars.PUBLISH_PUB }}" != "true" ]; then
            echo "::notice::PUBLISH_PUB is not 'true' -- skipping pub.dev."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dart-lang/setup-dart@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          sdk: "3.5"
      - if: steps.gate.outputs.ready == 'true'
        run: dart pub get
      - if: steps.gate.outputs.ready == 'true'
        run: dart pub publish --dry-run
      - name: Publish
        if: steps.gate.outputs.ready == 'true'
        run: dart pub publish --force

  maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: packages/kotlin
    steps:
      - uses: actions/checkout@v4

      # This gate must come BEFORE setup-java: passing it an empty
      # gpg-private-key makes the action fail outright, which is what turned a
      # not-yet-configured registry into a red release.
      - name: Skip when Central credentials are absent
        id: gate
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${USERNAME}" ] || [ -z "${KEY}" ]; then
            echo "::notice::Maven Central credentials are not set -- skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          # Writes ~/.m2/settings.xml with a `central` server entry.
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy signed artifacts
        if: steps.gate.outputs.ready == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B --no-transfer-progress -P release deploy

      - name: Attach the JAR to the GitHub Release
        if: steps.gate.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/kotlin/target/nishachar-ide-*.jar

  container:
    name: Publish the container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nishachar-ide
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A manual run happens on a branch, which matches no semver rule.
            # Without this the tag list is empty and buildx refuses to push.
            type=ref,event=branch
            # `latest` should track the newest release, not whatever branch
            # was last dispatched.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
